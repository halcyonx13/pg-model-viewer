name: Release

# One-button release: bump the version, tag, build installers for
# Windows / macOS / Linux (each with the frozen model-extractor sidecar),
# and publish a GitHub Release with all artifacts attached.
#
# Trigger via Actions → Release → Run workflow, choosing a bump
# (patch/minor/major) or an explicit x.y.z version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump (patch/minor/major) or explicit x.y.z"
        required: true
        default: "patch"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Verify the code and signing setup before changing main or creating a tag.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require a release from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run the Release workflow from main after merging your changes."
            exit 1
          fi

      - name: Check signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Configure the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install test dependencies
        run: |
          npm ci
          python -m pip install -r tools/model_extractor/requirements.txt -r tools/release-requirements.txt

      - name: Verify updater configuration and signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python -c 'import json, os; c=json.load(open("src-tauri/tauri.conf.json")); expected="https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/releases/latest/download/latest.json"; assert c["plugins"]["updater"]["endpoints"] == [expected], "Updater endpoint must target this repository"; assert c["bundle"]["createUpdaterArtifacts"] is True'
          printf 'PG Model Viewer signing check\n' > "$RUNNER_TEMP/updater-signing-check"
          npx tauri signer sign "$RUNNER_TEMP/updater-signing-check" > /dev/null
          python tools/release_artifacts.py verify "$RUNNER_TEMP/updater-signing-check"

      - name: Test and build
        run: |
          npm run build
          node tools/test_install_flow.cjs
          node tools/test_equipment_panels.cjs
          python -m unittest discover -s tools/model_extractor -p 'test_*.py'
          python -m unittest discover -s tools -p 'test_release_artifacts.py'
          cargo test --locked --lib --manifest-path src-tauri/Cargo.toml

  # ── Step 1: bump version files, commit to main, push the tag ──
  bump:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout the validated main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Compute and apply version bump
        id: bump
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CURRENT=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          IFS=. read -r MA MI PA <<< "$CURRENT"
          case "$RELEASE_VERSION_INPUT" in
            patch) VERSION="$MA.$MI.$((PA+1))" ;;
            minor) VERSION="$MA.$((MI+1)).0" ;;
            major) VERSION="$((MA+1)).0.0" ;;
            *)
              if [[ "$RELEASE_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then VERSION="$RELEASE_VERSION_INPUT"
              else echo "Invalid version input: $RELEASE_VERSION_INPUT"; exit 1; fi ;;
          esac
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"; exit 1
          fi
          echo "Bumping $CURRENT → $VERSION"
          python3 tools/bump_version.py "$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          # No diff = re-releasing the current version (e.g. after a CI fix
          # where the previous attempt's tag was deleted) — just re-tag.
          if git diff --cached --quiet; then
            echo "Version files already at $VERSION — re-tagging"
          else
            git commit -m "release: $TAG"
          fi
          git tag "$TAG"
          git push --atomic origin HEAD:main "$TAG"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ── Step 2: build installers on all platforms (with the extractor sidecar) ──
  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows
            triple: x86_64-pc-windows-msvc
            bundle_dir: src-tauri/target/release/bundle
            args: ""
          - platform: macos-latest
            label: macos
            triple: aarch64-apple-darwin
            bundle_dir: src-tauri/target/aarch64-apple-darwin/release/bundle
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-latest
            label: linux
            triple: x86_64-unknown-linux-gnu
            bundle_dir: src-tauri/target/release/bundle
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout (at release tag)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python (for the extractor sidecar)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Freeze model-extractor sidecar
        shell: bash
        run: tools/model_extractor/build_sidecar.sh "${{ matrix.triple }}"

      - name: Smoke-test frozen extractor
        shell: bash
        env:
          EXTRACTOR_TRIPLE: ${{ matrix.triple }}
        run: |
          EXTRACTOR="src-tauri/binaries/model-extractor-${EXTRACTOR_TRIPLE}"
          if [ "$RUNNER_OS" = "Windows" ]; then EXTRACTOR="${EXTRACTOR}.exe"; fi
          "$EXTRACTOR" --help

      - name: Install frontend dependencies
        run: npm ci

      # Build only — no tagName/releaseName so tauri-action doesn't create a
      # release. externalBin is declared here (release-only) so `tauri dev`
      # doesn't require the sidecar locally.
      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (latest.json signatures).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          # Do not override app.windows: arrays replace the original window
          # settings, including dragDropEnabled:false required by Windows DnD.
          args: ${{ matrix.args }} --ci --config '{"bundle":{"externalBin":["binaries/model-extractor"]}}' -- --locked

      - name: Collect artifacts
        shell: bash
        env:
          VERSION: ${{ needs.bump.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.label }}
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
        run: |
          python tools/release_artifacts.py collect \
            --bundle-dir "$BUNDLE_DIR" --destination release-artifacts \
            --platform "$RELEASE_PLATFORM" --version "$VERSION"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.label }}
          path: release-artifacts/*
          if-no-files-found: error

  # ── Step 3: publish the GitHub Release with everything attached ──
  publish:
    needs: [bump, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release validation tools and public key
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install signature-verification dependency
        run: python -m pip install -r tools/release-requirements.txt

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: all-artifacts
          merge-multiple: true

      - name: Generate latest.json updater manifest
        env:
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          python tools/release_artifacts.py manifest \
            --directory all-artifacts --repository "$GITHUB_REPOSITORY" --version "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          ls -la all-artifacts/
          gh release create "$TAG" all-artifacts/* \
            --repo "${{ github.repository }}" \
            --title "PG Model Viewer $TAG" \
            --generate-notes
